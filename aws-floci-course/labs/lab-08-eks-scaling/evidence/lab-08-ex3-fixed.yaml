apiVersion: apps/v1
kind: Deployment
metadata:
  name: usms-reports
  namespace: usms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usms-reports
  template:
    metadata:
      labels:
        app: usms-reports
    spec:
      containers:
        - name: reports
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"        # FIX 1: an explicit request - the HPA's denominator, chosen, not defaulted
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: usms-reports-hpa
  namespace: usms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: usms-reports
  minReplicas: 2       # FIX 2: was 4 = maxReplicas, which left the HPA one possible answer
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
