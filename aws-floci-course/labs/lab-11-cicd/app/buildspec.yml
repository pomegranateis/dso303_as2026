version: 0.2

env:
  variables:
    SERVICE_NAME: "enrolment"
    ARTIFACT_DIR: "dist"

phases:

  install:
    commands:
      - echo "--- install ---"
      - python3 --version
      - sed --version 2>/dev/null | head -1 || echo "BSD sed"

  pre_build:
    commands:
      - echo "--- pre_build ---"
      - test -f VERSION || { echo "VERSION file is missing"; exit 1; }
      - python3 -m json.tool config/service.json > /dev/null
      - |
        python3 - << 'CHECK'
        import json, sys
        cfg = json.load(open("config/service.json"))
        got = cfg.get("container")
        if got != "enrolment-api":
            sys.exit('config/service.json names the wrong container: expected "enrolment-api", found %s' % json.dumps(got))
        got = cfg.get("port")
        if got != 80:
            sys.exit('config/service.json: "port" must be 80 - the port enrolment-api listens on and the target group checks - found %s' % json.dumps(got))
        CHECK
      - echo "configuration validated"

  build:
    commands:
      - echo "--- build ---"
      - USMS_RELEASE="$(tr -d '[:space:]' < VERSION)"
      - BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - echo "release=$USMS_RELEASE builtAt=$BUILT_AT"
      - rm -rf "$ARTIFACT_DIR"
      - mkdir -p "$ARTIFACT_DIR"
      - cp -R src/. "$ARTIFACT_DIR"/
      - sed -i.bak -e "s|__RELEASE__|$USMS_RELEASE|g" -e "s|__BUILT_AT__|$BUILT_AT|g" "$ARTIFACT_DIR/index.html"
      - rm -f "$ARTIFACT_DIR/index.html.bak"
      - |
        cat > "$ARTIFACT_DIR/build-metadata.json" << META
        {
          "service": "$SERVICE_NAME",
          "release": "$USMS_RELEASE",
          "builtAt": "$BUILT_AT",
          "buildId": "${CODEBUILD_BUILD_ID:-local}",
          "sourceVersion": "${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}"
        }
        META
      - cp config/service.json "$ARTIFACT_DIR/service.json"
      - |
        IMAGE_URI="${IMAGE_URI:-public.ecr.aws/nginx/nginx:stable-alpine}" python3 - > "$ARTIFACT_DIR/imagedefinitions.json" << 'IMGDEF'
        import json, os
        cfg = json.load(open("config/service.json"))
        print(json.dumps([{"name": cfg["container"], "imageUri": os.environ["IMAGE_URI"]}], indent=2))
        IMGDEF
      - cat "$ARTIFACT_DIR/imagedefinitions.json"

  post_build:
    commands:
      - echo "--- post_build ---"
      - echo "not-run" > /tmp/usms-smoke-exit
      - |
        rc=0
        bash tests/smoke.sh || rc=$?
        echo "$rc" > /tmp/usms-smoke-exit
        [ "$rc" -eq 0 ]
      - ls -l "$ARTIFACT_DIR"
      - cat "$ARTIFACT_DIR/build-metadata.json"
    finally:
      - mkdir -p "$ARTIFACT_DIR"
      - |
        SMOKE_EXIT="$(cat /tmp/usms-smoke-exit 2>/dev/null || echo not-run)"
        case "$SMOKE_EXIT" in 0) TESTS=passed ;; not-run) TESTS=not-run ;; *) TESTS=failed ;; esac
        printf 'release=%s tests=%s smoke_exit=%s build=%s finishedAt=%s\n' \
          "$(tr -d '[:space:]' < VERSION)" "$TESTS" "$SMOKE_EXIT" \
          "${CODEBUILD_BUILD_ID:-local}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          > "$ARTIFACT_DIR/build-summary.txt"
        cat "$ARTIFACT_DIR/build-summary.txt"

artifacts:
  base-directory: dist
  files:
    - '**/*'

cache:
  paths: []
