apiVersion: v1
kind: ConfigMap
metadata:
  name: usms-enrolment-conf
  namespace: usms
  labels:
    app: usms-enrolment
data:
  default.conf.template: |
    server {
      listen 80;
      server_name _;

      location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location / {
        add_header Content-Type application/json;
        return 200 '{"service":"usms-enrolment","pod":"${POD_NAME}","node":"${NODE_NAME}","env":"${APP_ENVIRONMENT}","version":"${APP_VERSION}"}\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usms-enrolment
  namespace: usms
  labels:
    app: usms-enrolment
    project: usms
    tier: app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: usms-enrolment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: usms-enrolment
        project: usms
        tier: app
    spec:
      # Exercise 4. Spread the replicas across nodes. ScheduleAnyway makes this advisory:
      # with one node (this Floci build) both pods still schedule, side by side.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: usms-enrolment
      containers:
        - name: enrolment
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - configMapRef:
                name: usms-app-config
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/templates
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: conf
          configMap:
            name: usms-enrolment-conf
---
apiVersion: v1
kind: Service
metadata:
  name: usms-enrolment
  namespace: usms
  labels:
    app: usms-enrolment
spec:
  type: ClusterIP
  selector:
    app: usms-enrolment
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Exercise 4. Enforced: a voluntary disruption (a node drain, a node group upgrade)
# may never take usms-enrolment below one ready pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: usms-enrolment-pdb
  namespace: usms
  labels:
    app: usms-enrolment
    project: usms
    tier: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: usms-enrolment
